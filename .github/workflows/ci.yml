name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply shared SQL migrations through Python
        working-directory: backend
        run: python -m app.migrate
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
          QP_QUERY_PASSWORD: integration-ci-password
      - name: TypeScript compatibility integration tests
        run: npx vitest run tests/integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          QP_QUERY_PASSWORD: integration-ci-password
      - name: Python real-Postgres integration tests
        working-directory: backend
        run: python -m pytest -q tests/test_integration.py tests/test_isolation_integration.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          QP_QUERY_PASSWORD: integration-ci-password
